[package]
name = "einsteinbot"
version = "0.1.0"
edition = "2024"
default-run = "einsteinbot"

[dependencies]
ctrlc = "3.5"
rusqlite = { version = "0.42", features = ["bundled"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
nalgebra = "0.34"
levenberg-marquardt = "0.15"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
